<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Némesis Fiorella 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300&display=swap" rel="stylesheet">
<style>
  body { margin:0; overflow:hidden; background:#020208; font-family:'Poppins', sans-serif; }
  canvas { display:block; }
  #inicio {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#ffeb3b; border:1px solid #ffeb3b; padding:18px 35px; 
    border-radius:50px; cursor:pointer; z-index:20; background:rgba(255,235,59,0.1);
    backdrop-filter: blur(10px); font-size:18px; letter-spacing:1px;
    box-shadow:0 0 20px rgba(255,235,59,0.5); animation:latido 1.5s infinite;
  }
  @keyframes latido { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.05)} }
  #titulo-central {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; z-index:10; pointer-events:none; display:none;
  }
  #titulo-central h1 {
    font-family:'Dancing Script', cursive; font-size:42px; color:#ffeb3b;
    margin:0; text-shadow:0 0 15px gold, 0 0 30px orange;
  }
  #titulo-central p { color:white; font-size:14px; letter-spacing:2px; margin-top:5px; opacity:0.8; }
</style>
</head>
<body>
<div id="inicio">Toca para ver tu universo, Némesis 💛🌻</div>
<div id="titulo-central">
  <h1>Némesis Fiorella<br>Beltrán Miranda</h1>
  <p>Mi Flor Amarilla Eterna • 21 de Septiembre</p>
</div>
<canvas id="galaxia"></canvas>
<audio id="audio" loop src="https://cdn.dedicacodes.com/t/galaxia-nebulosa-flores-amarillas/1.0.0/assets/musica.mp3"></audio>

<script>
const canvas = document.getElementById('galaxia');
const ctx = canvas.getContext('2d');
let w, h, iniciado=false;
function resize(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();

// Mensajes lindos que orbitarán
const frases = [
  "Eres mi universo 💛", "Mi flor amarilla favorita 🌻", "Te amo infinitamente",
  "Némesis hermosa", "Eres mi todo", "Contigo hasta el final",
  "Mi razón de sonreír", "Fiorella preciosa"
];

const objetos = [];
// 80 flores
for(let i=0; i<80; i++){
  objetos.push({ tipo:'flor', ang:Math.random()*Math.PI*2, dist:90+Math.random()*320, vel:0.003+Math.random()*0.008, size:14+Math.random()*16, txt:'🌻' });
}
// 8 mensajes
frases.forEach((txt, i)=>{
  objetos.push({ tipo:'texto', ang:(Math.PI*2/frases.length)*i, dist:200+Math.random()*100, vel:0.0015, size:14, txt:txt });
});

let estrellas=[];
for(let i=0; i<400; i++) estrellas.push({x:Math.random()*3000-1500, y:Math.random()*3000-1500, r:Math.random()*1.8, b:Math.random()});

function animar(){
  ctx.fillStyle='rgba(2,2,8,0.4)';
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2, cy=h/2;
  // estrellas fondo
  ctx.fillStyle='white';
  estrellas.forEach(s=>{
    let x = cx + s.x*0.1; let y = cy + s.y*0.1;
    ctx.globalAlpha=0.3+Math.sin(Date.now()*0.001+s.b*10)*0.7;
    ctx.beginPath(); ctx.arc(x,y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // agujero negro + brillo dorado
  let grad = ctx.createRadialGradient(cx,cy,5,cx,cy,90);
  grad.addColorStop(0,'#000'); grad.addColorStop(0.4,'#1a0a2e'); grad.addColorStop(1,'rgba(255,215,0,0.25)');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(cx,cy,90,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,235,59,0.3)'; ctx.lineWidth=2; ctx.stroke();

  objetos.forEach(o=>{
    if(iniciado) o.ang+=o.vel;
    let x = cx + Math.cos(o.ang)*o.dist;
    let y = cy + Math.sin(o.ang)*o.dist*0.65;
    ctx.save(); ctx.translate(x,y);
    if(o.tipo==='flor'){
      ctx.rotate(o.ang); ctx.font=`${o.size}px serif`;
      ctx.shadowColor='gold'; ctx.shadowBlur=10;
      ctx.fillText(o.txt, -o.size/2, o.size/2);
    } else {
      ctx.fillStyle='rgba(255,235,59,0.9)'; ctx.font=`${o.size}px Poppins`;
      ctx.shadowColor='gold'; ctx.shadowBlur=8; ctx.fillText(o.txt,0,0);
    }
    ctx.restore();
  });
  requestAnimationFrame(animar);
}
animar();

document.getElementById('inicio').onclick=()=>{
  iniciado=true;
  document.getElementById('audio').play().catch(()=>{});
  document.getElementById('inicio').style.display='none';
  document.getElementById('titulo-central').style.display='block';
  document.getElementById('titulo-central').style.animation='latido 2s infinite';
}
</script>
</body>
</html>
